name: Sight CI/CD & Platform Scraping Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # 每日定时巡检各平台线上接口与签名算法是否有效 (UTC 20:00 = 北京时间 04:00)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      strict_live:
        description: "严格模式：要求所有平台（含需 Cookie 的平台）线上真实抓取均必须 PASS"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  platform-scraping-contract:
    name: Backend & All-Platform Scraping Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Required for Douyin/XHS JS Signature Stack)
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all platform scraping unit & contract tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build-and-e2e:
    name: Frontend Typecheck, Unit, Build & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm test

      - name: Build production frontend bundle (app/web)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests across all platforms
        run: npm run test:e2e

  live-platform-scraping:
    name: Live Platform Scraping Probe (All 8 Platforms)
    runs-on: ubuntu-latest
    needs: [platform-scraping-contract]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Required for Douyin/XHS JS Signature Stack)
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify live scraping across all registered platforms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGHT_ACCOUNTS_JSON: ${{ secrets.SIGHT_ACCOUNTS_JSON }}
        run: |
          if [ "${{ inputs.strict_live }}" = "true" ]; then
            python scripts/verify_live_scraping.py --strict
          else
            python scripts/verify_live_scraping.py
          fi
